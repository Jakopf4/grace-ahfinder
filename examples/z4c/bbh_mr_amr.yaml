      target_level_delta: 1,
      x_min: -512,
      x_max: 512,
      y_min: -512,
      y_max: 512,
      z_min: 0,
      z_max: 256
    },
    {
      target_level_delta: 2,
      x_min: -256,
      x_max: 256,
      y_min: -256,
      y_max: 256,
      z_min: 0,
      z_max: 128
    },
    {
      target_level_delta: 3,
      x_min: -128,
      x_max: 128,
      y_min: -128,
      y_max: 128,
      z_min: 0,
      z_max: 64
    },
    {
      target_level_delta: 4,
      x_min: -64,
      x_max: 64,
      y_min: -64,
      y_max: 64,
      z_min: 0,
      z_max: 32
    },
    {
      target_level_delta: 5,
      x_min: -32,
      x_max: 32,
      y_min: -32,
      y_max: 32,
      z_min: 0,
      z_max: 16
    },
    {
      target_level_delta: 6,
      x_min: -16,
      x_max: 16,
      y_min: -16,
      y_max: 16,
      z_min: 0,
      z_max: 8
    }
  ],

  regrid_at_postinitial: true,
  postinitial_regrid_depth: 2,

  regrid_every: 50,

  refinement_criterion: "simple_threshold",
  refinement_criterion_var: "conf_fact",
  refinement_criterion_CTORE: 0.7,
  refinement_criterion_CTODE: 0.8,
  refinement_criterion_reduction: "min",
  refinement_criterion_var_is_aux: false
}

IO: {
  volume_output_every: -1,

  plane_surface_output_cell_variables: ["metric"],
  plane_surface_output_every: 1000,

  sphere_surface_output_every: -1,

  info_output_every: 2,
  info_output_min_reductions: ["alp","conf_fact"],
  info_output_norm2_reductions: ["z4c_H"],

  scalar_output_every: 2,
  scalar_output_minmax: ["conf_fact","alp"],
  scalar_output_norm2: ["z4c_H"],
  scalar_output_integral: [],

  output_use_hdf5: true,
  hdf5_compression_level: 0,
  hdf5_chunk_size: 8192,
  output_extra_quantities: true,

  xy_plane_offset: 0.015,

  diagnostic_output_every: 1

}
system: {
  console_log_level: "info",
  file_log_level: "trace",
  n_device_streams: 4,
  flush_logs_based_on_severity: true,
  flush_severity_level: "trace"
}
evolution: {
  time_stepper: "rk4",
  cfl_factor: 0.4,
  final_walltime: 23.5,
  termination_condition: "walltime"
}

grmhd: {
  id_type: "two_punctures",
  two_punctures: {
    par_b: 3.257,

    target_M_plus: 0.505,
    par_P_plus_x: 0.0,
    par_P_plus_y: -0.133,
    par_P_plus_z: 0.0,
    par_S_plus_x: 0.0,
    par_S_plus_y: 0.0,
    par_S_plus_z: 0.0,

    target_M_minus: 0.505,
    par_P_minus_x: 0.0,
    par_P_minus_y: 0.133,
    par_P_minus_z: 0.0,
    par_S_minus_x: 0.0,
    par_S_minus_y: 0.0,
    par_S_minus_z: 0.0,

    npoints_A: 30,
    npoints_B: 30,
    npoints_phi: 16,

    TP_epsilon: 0.0
  }
}

z4c: {
  kappa_1: 0.02,
  kappa_2: 0.0,
  eta: 2.0,
  eps_diss: 0.5,
  chi_floor: 1e-11,
  is_vacuum: true,
  eta_damp_radius: 256,
  kappa_damp_radius: 512,
  theta_damp_radius: 512
}

spherical_surfaces: {

  n_surfaces: 2,

  spherical_detectors: [
    {
      name: "GW_1",
      tracking: "none",
      radius: 60.0,
      x_c: 0.0,
      y_c: 0.0,
      z_c: 0.0,
      
      sampling_policy: "uniform",
      resolution: 91
    },
    {
      name: "GW_2",
      tracking: "none",
      radius: 100.0,
      x_c: 0.0,
      y_c: 0.0,
      z_c: 0.0,
      
      sampling_policy: "uniform",
      resolution: 91
    }
  ]
}

gw_integrals: {
  detector_names: ["GW_1","GW_2"]
}

checkpoints: {
  checkpoint_dir: "../checkpoints",
  max_n_checkpoints: 4,
  checkpoint_at_startup: true
}

# --- Apparent horizons ------------------------------------------------------
#
# Two individual horizons plus the common one that forms at merger.
#
# The punctures start at x = +/- par_b = +/- 3.257 and orbit in the xy plane, so
# both individual surfaces have track_center on: the origin is moved to the
# centroid after every find and the shape re-expressed about it, which keeps the
# warm start alive as the holes move.  Without that the surface would be rigidly
# translated and every find would start from scratch.
#
# The grid is equatorially symmetric (reflection_symmetries.z), so half of every
# collocation-point set lies outside the computed domain.  The finder samples
# the mirror points and carries the ADM tensors back across the plane by their
# parity -- exact for a spacetime that has the symmetry, and nothing to
# configure.
#
# Sizing: each puncture has M ~ 0.505, so its horizon sits near r ~ 0.25 at t = 0
# and grows towards ~0.4 M as the slice relaxes.  The guesses start outside,
# where the expansion is positive and the solve descends inwards.  The FMR floor
# is dx = 0.125 but the conf_fact criterion refines further around the holes, to
# dx = 0.03125 at max_refinement_level 10 -- about 8 cells per horizon radius.
# If a run reports `stalled` with a large residual, that is the grid talking,
# not the solver.
#
# AH_common stays dormant and costs only a trigger test until its parents come
# close enough, then is seeded from them automatically -- centre on the
# irreducible-mass-weighted midpoint, radius large enough to enclose both.  It
# fires on proximity (a common horizon forms well before the individual surfaces
# touch), on genuine intersection, or on both parents having existed and both
# now failing, which is itself a merger signature.  parent_staleness_limit
# bounds how far back a parent's last successful result may be reused for that,
# in iterations -- a few times find_every.
#
# The individuals keep being searched after merger; they persist inside the
# common horizon for a while and their areas stay meaningful.  Once one has been
# found and then fails stop_after_failures times in a row it is presumed gone
# and dropped, so a vanished horizon does not cost a search forever.
apparent_horizon: {
  n_horizons: 3,
  find_every: 32,
  verbose: true,
  output_shape: false,

  horizons: [
    {
      name: "AH1",
      l_max: 8,
      initial_radius: 0.5,
      center_x: 3.257, center_y: 0.0, center_z: 0.0,
      tolerance: 5.0e-4,
      max_iterations: 40,
      max_relative_step: 0.1,
      track_center: true,
      find_every: -1,
      enabled: true
    },
    {
      name: "AH2",
      l_max: 8,
      initial_radius: 0.5,
      center_x: -3.257, center_y: 0.0, center_z: 0.0,
      tolerance: 5.0e-4,
      max_iterations: 40,
      max_relative_step: 0.1,
      track_center: true,
      find_every: -1,
      enabled: true
    },
    {
      name: "AH_common",
      role: "common",
      parents: ["AH1", "AH2"],
      # Higher l_max: the common horizon is strongly distorted when it first
      # appears.  The Killing-vector eigensolve is O(l_max^6), ~8 ms here
      # against ~3.5 ms at l_max 8, which is still small next to the sampling.
      l_max: 10,
      # Only used before the first trigger; once the parents are close it is
      # re-seeded from them.
      initial_radius: 2.0,
      center_x: 0.0, center_y: 0.0, center_z: 0.0,
      tolerance: 2.0e-4,
      max_iterations: 40,
      max_relative_step: 0.1,
      track_center: true,
      find_every: -1,
      trigger_separation_factor: 2.5,
      parent_staleness_limit: 128,
      overlap_margin: 0.0,
      stop_after_failures: 5,
      enabled: true
    }
  ]
}
