spherical_surfaces:
  type: schema 
  description: >
    Spheres 
  
  n_surfaces:
    type: unsigned int 
    default: 0
    range: "[0,*)"
    description: >
      Number of spherical surfaces

  spherical_detectors:
    type: list 
    item_type: node 
    description: >
      Descriptors of spherical detectors 
    item_schema:
      name:
        type: string 
        default: "spherical_detector"
        description: >
          Name of the detector
      tracking:
        type: keyword
        allowed: ["none", "apparent_horizon"]
        default: "none"
        description: >
          Tracking policy for the sphere.  "apparent_horizon" makes the surface
          follow a horizon located by the apparent_horizon module: its centre
          moves to the horizon centroid and its radius becomes
          tracking_radius_factor times the horizon's mean coordinate radius.
          The surface keeps its configured geometry until that horizon is first
          found.
      tracking_target:
        type: string
        default: ""
        description: >
          Name of the apparent horizon to follow.  Empty means the horizon with
          the same name as this detector.  Ignored unless tracking is
          "apparent_horizon".
      tracking_radius_factor:
        type: double
        range: "(0,*)"
        default: 1.0
        description: >
          Detector radius as a multiple of the tracked horizon's mean
          coordinate radius.  Use a value above 1 to sit outside the horizon. 
      radius: 
        type: double 
        range: "(0,*)"
        default: 1.0
        description: >
          Radius of the sphere
      x_c:
        type: double 
        range: "(*,*)"
        default: 0.0 
        description: >
          X coordinate of sphere center 
      y_c:
        type: double 
        range: "(*,*)"
        default: 0.0 
        description: >
          Y coordinate of sphere center 
      z_c:
        type: double 
        range: "(*,*)"
        default: 0.0 
        description: >
          Z coordinate of sphere center 
      sampling_policy:
        type: keyword
        allowed: ["uniform"]
        default: "uniform"
        description: >
          Policy for sphere discretization 
      resolution: 
        type: int 
        range: "(0,*)"
        default: 32 
        description: >
          Resolution of detector 
      